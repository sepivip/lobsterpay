version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - next
          - "@next/*"
          - react
          - react-dom
      solana:
        patterns:
          - "@solana/*"
          - "@coral-xyz/*"
      fastify:
        patterns:
          - fastify
          - "@fastify/*"

  - package-ecosystem: cargo
    # Cargo workspace's Cargo.lock lives at the repo root, not under
    # programs/lobsterpay - dependabot needs the directory pointing at
    # the lockfile or it silently does nothing.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
