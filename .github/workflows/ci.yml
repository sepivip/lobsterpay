name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_CLI_VERSION: "3.1.13"
  ANCHOR_VERSION: "0.31.1"

jobs:
  node:
    name: node (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version is read from the `packageManager` field in
      # package.json (currently pnpm@9.15.4). Specifying `version` here
      # too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        # Non-blocking until the existing repo-wide lint backlog is paid
        # down. Use continue-on-error so failures are visible in the UI
        # rather than silently swallowed by `|| true`.
        continue-on-error: true
        run: pnpm exec biome ci .
      - name: TypeScript build (workspace)
        run: pnpm -r build

  anchor:
    name: anchor (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: Cache cargo
        # Cache ~/.cargo/bin too so the anchor-cli install survives
        # across CI runs (re-installing it via cargo install --git is
        # slow and flaky on a cold cache).
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Solana CLI ${{ env.SOLANA_CLI_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_CLI_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor ${{ env.ANCHOR_VERSION }} (skip if cached)
        run: |
          if ! command -v anchor >/dev/null 2>&1; then
            cargo install --git https://github.com/coral-xyz/anchor \
              --tag "v${{ env.ANCHOR_VERSION }}" anchor-cli --locked
          else
            echo "anchor already installed: $(anchor --version)"
          fi
      # pnpm version is read from the `packageManager` field in
      # package.json (currently pnpm@9.15.4). Specifying `version` here
      # too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Anchor build
        run: anchor build
      - name: Anchor test
        run: anchor test
